<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Film and Series Tracker</title>
    <style>
        body { font-family: sans-serif; max-width: 800px; margin: 2rem auto; padding: 0 1rem; }
        table { width: 100%; border-collapse: collapse; }
        th, td { text-align: left; padding: 0.5rem; border-bottom: 1px solid #ddd; }
        form { display: flex; flex-wrap: wrap; gap: 1rem; align-items: center; margin-bottom: 1.5rem; }
        .error { color: #b00020; }
    </style>
</head>
<body>
    <h1>Film and Series Tracker</h1>

    <form id="title-form">
        <label>
            Name
            <input name="name" required maxlength="255">
        </label>
        <label>
            Type
            <select name="type">
                <!-- The values must match the TitleType enum on the server. -->
                <option value="film">Film</option>
                <option value="series">Series</option>
            </select>
        </label>
        <label>
            Year
            <input name="year" type="number" required min="1900">
        </label>
        <label>
            <input name="watched" type="checkbox">
            Watched
        </label>
        <button type="submit">Add</button>
    </form>

    <form id="filter-form" role="search">
        <label>
            Search
            <input name="search" type="search" placeholder="Name contains...">
        </label>
        <label>
            Type
            <select name="type">
                <option value="">All</option>
                <option value="film">Films</option>
                <option value="series">Series</option>
            </select>
        </label>
        <label>
            Watched
            <select name="watched">
                <option value="">All</option>
                <option value="true">Watched</option>
                <option value="false">Not watched</option>
            </select>
        </label>
    </form>

    <p id="error-message" class="error" hidden></p>

    <table>
        <thead>
            <tr>
                <th>Name</th>
                <th>Type</th>
                <th>Year</th>
                <th>Watched</th>
                <th></th>
            </tr>
        </thead>
        <tbody id="title-list"></tbody>
    </table>

    <!-- At the end of body, so the elements above already exist when app.js runs.
         The leading / loads it from the site root, even if the address ends in "index.html/". -->
    <script src="/app.js"></script>
</body>
</html>
